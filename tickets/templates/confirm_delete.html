{% extends 'base.html' %}

{% block content %}
<style>
    /* --- UNIFORM STYLES --- */
    body { background-color: #ADD8E6; overflow-x: hidden; font-family: system-ui, -apple-system, sans-serif; }
    
    .blob { position: fixed; width: 550px; height: 550px; background: linear-gradient(135deg, rgba(220, 38, 38, 0.1) 0%, rgba(153, 27, 27, 0.05) 100%); filter: blur(90px); border-radius: 50%; z-index: -1; }
    .blob-1 { top: -120px; right: -120px; }
    .blob-2 { bottom: -120px; left: -120px; }

    .glass-warning-card { 
        background: rgba(255, 255, 255, 0.85); 
        backdrop-filter: blur(20px); 
        border-radius: 28px; 
        padding: 50px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        max-width: 500px;
        margin: 80px auto;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .warning-icon {
        font-size: 5rem;
        color: #dc3545;
        margin-bottom: 20px;
        display: block;
    }
</style>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container animate-entrance">
    <div class="glass-warning-card">
        <i class="bi bi-exclamation-triangle-fill warning-icon"></i>
        
        <h2 class="fw-bold text-dark mb-3">Delete Request?</h2>
        <p class="text-secondary mb-4">
            You are about to delete ticket <strong>#{{ ticket.id }}</strong>: <em>{{ ticket.title }}</em>. 
            <br>This action is permanent and cannot be undone.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-3">
                <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-trash3 me-2"></i> Confirm Deletion
                </button>
                <a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-link text-decoration-none text-muted fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Cancel, keep my ticket
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
