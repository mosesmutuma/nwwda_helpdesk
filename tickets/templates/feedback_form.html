{% extends 'base.html' %}

{% block content %}
<style>
    /* --- CSS FIXED STRUCTURE --- */
    body {
        background-color: #ADD8E6; /* Light Blue background */
        overflow-x: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        color: #0f172a;
        margin: 0;
        padding: 0;
    }

    /* FIX: FORCING CONTAINER UP AND REMOVING TOP MARGIN COMPLETELY */
    .container {
        margin-top: 5px !important; /* Forces the entire form structure to sit right below the nav bar */
        padding-top: 0 !important;
    }

    /* Compact Typography Layout */
    .title-area h2 {
        font-size: 2.1rem !important;
        font-weight: 800 !important;
        color: #0f172a;
        margin-top: 0 !important;
        margin-bottom: 4px !important;
        letter-spacing: -0.5px;
    }

    .title-area p {
        font-size: 0.9rem !important;
        color: #64748b;
        margin: 0 !important;
    }

    /* Professional Compact Glass Form Card */
    .glass-form-card {
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(226, 232, 240, 0.5);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.05);
        position: relative;
        margin-top: 15px !important; /* Clean distance from title metrics */
    }

    /* Compact Rating Scale Component */
    .rating-container {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        background: #f1f5f9;
        padding: 6px;
        border-radius: 12px;
    }

    .rating-item {
        position: relative;
        flex: 1;
    }

    .rating-radio {
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        z-index: 3;
        margin: 0;
    }

    .rating-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px !important;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 2;
        font-size: 0.8rem !important;
    }

    .rating-emoji {
        font-size: 1.3rem !important;
        margin-bottom: 3px;
        transition: transform 0.2s ease;
    }

    .rating-text {
        font-size: 0.7rem !important;
        font-weight: 700;
        color: #64748b;
        text-transform: uppercase;
    }

    /* Hover States */
    .rating-item:hover .rating-box {
        background: #f0f9ff;
        border-color: #0ea5e9;
    }
    .rating-item:hover .rating-emoji {
        transform: scale(1.1);
    }

    /* Checked Component Active Configurations */
    .rating-item:nth-child(1) .rating-radio:checked + .rating-box { background: #fef2f2; border-color: #ef4444; color: #b91c1c; }
    .rating-item:nth-child(2) .rating-radio:checked + .rating-box { background: #fff7ed; border-color: #f97316; color: #c2410c; }
    .rating-item:nth-child(3) .rating-radio:checked + .rating-box { background: #fefce8; border-color: #eab308; color: #a16207; }
    .rating-item:nth-child(4) .rating-radio:checked + .rating-box { background: #f0fdf4; border-color: #22c55e; color: #15803d; }
    .rating-item:nth-child(5) .rating-radio:checked + .rating-box { background: #ecfeff; border-color: #06b6d4; color: #0e7490; }

    .rating-radio:checked + .rating-box {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    
    .rating-radio:checked + .rating-box .rating-text {
        font-weight: 800;
        letter-spacing: 0.5px;
    }

    /* Form Controls */
    .form-label {
        font-weight: 700;
        color: #334155;
        margin-bottom: 10px;
        font-size: 0.8rem !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px 18px;
        border: 1px solid #cbd5e1;
        background: rgba(255, 255, 255, 0.95);
        transition: all 0.2s;
        font-size: 0.95rem;
    }

    .form-control:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        transform: translateY(-1px);
    }

    .btn-submit {
        background: linear-gradient(135deg, #1e3a8a 0%, #0ea5e9 100%);
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        transition: all 0.25s ease;
        box-shadow: 0 8px 16px rgba(14, 165, 233, 0.15);
    }

    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(14, 165, 233, 0.25);
        color: white;
    }

    /* Entrance Animation */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-entrance {
        animation: fadeInUp 0.5s ease-out forwards;
    }
</style>

<div class="container animate-entrance" style="max-width: 650px;">
    
    <div class="title-area text-center">
        <h2>Share Your Feedback</h2>
        <p>How was your experience with our support portal?</p>
    </div>

    <div class="glass-form-card shadow-lg">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label"><i class="bi bi-emoji-smile me-2 text-primary"></i>Rate Overall Experience</label>
                <div class="rating-container">
                    <div class="rating-item">
                        <input type="radio" name="experience_rating" value="1" class="rating-radio" required>
                        <div class="rating-box">
                            <span class="rating-emoji">😞</span>
                            <span class="rating-text">Bad</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <input type="radio" name="experience_rating" value="2" class="rating-radio">
                        <div class="rating-box">
                            <span class="rating-emoji">🙁</span>
                            <span class="rating-text">Poor</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <input type="radio" name="experience_rating" value="3" class="rating-radio" checked>
                        <div class="rating-box">
                            <span class="rating-emoji">😐</span>
                            <span class="rating-text">Okay</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <input type="radio" name="experience_rating" value="4" class="rating-radio">
                        <div class="rating-box">
                            <span class="rating-emoji">🙂</span>
                            <span class="rating-text">Good</span>
                        </div>
                    </div>
                    <div class="rating-item">
                        <input type="radio" name="experience_rating" value="5" class="rating-radio">
                        <div class="rating-box">
                            <span class="rating-emoji">🤩</span>
                            <span class="rating-text">Great</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="bi bi-pencil-square me-2 text-primary"></i>Comments or Suggestions</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Tell us what you liked or what we can improve..." required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-submit w-100 mb-2">
                    <i class="bi bi-send me-2"></i>Submit System Feedback
                </button>
                <a href="{% url 'home' %}" class="btn btn-link text-decoration-none text-secondary small fw-medium">
                    <i class="bi bi-arrow-left me-1"></i> Nevermind, return to dashboard
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
